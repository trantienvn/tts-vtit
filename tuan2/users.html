<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách người dùng – VSS Chat Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="users-page">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">
            <svg width="28" height="28" viewBox="0 0 52 52" fill="none">
                <rect width="52" height="52" rx="13" fill="white" fill-opacity="0.2"/>
                <path d="M10 16a5 5 0 015-5h22a5 5 0 015 5v14a5 5 0 01-5 5H29l-3 5-3-5H15a5 5 0 01-5-5V16z" fill="white"/>
                <circle cx="20" cy="23" r="3" fill="#EE0033"/>
                <circle cx="32" cy="23" r="3" fill="#EE0033"/>
            </svg>
            <span class="navbar-title">VSS Chat Platform</span>
        </div>
        <div class="navbar-right">
            <span class="user-greeting" id="user-greeting">Xin chào, Admin</span>
            <button class="btn-logout" id="btn-logout" title="Đăng xuất">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Đăng xuất
            </button>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Danh sách người dùng <span class="badge" id="user-count">0</span></h1>
            <button class="btn btn-primary" id="btn-add">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Thêm người dùng
            </button>
        </div>

        <!-- TABLE -->
        <div class="table-card">
            <div class="table-wrap">
                <table id="user-table">
                    <thead>
                        <tr>
                            <th style="width:52px">STT</th>
                            <th style="width:72px">Avatar</th>
                            <th>Họ</th>
                            <th>Tên</th>
                            <th>Email</th>
                            <th style="width:120px">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <div class="empty-state hidden" id="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
                <p>Chưa có người dùng nào. Nhấn <strong>Thêm người dùng</strong> để bắt đầu.</p>
            </div>
        </div>
    </main>

    <!-- MODAL -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal" id="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Thêm người dùng</h2>
                <button class="modal-close" id="modal-close" aria-label="Đóng">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="modal-form" novalidate>
                <div class="mfield">
                    <label class="mlabel">Avatar URL</label>
                    <input type="text" class="minp" id="m-avatar" placeholder="https://..." />
                    <div class="avatar-preview" id="avatar-preview">
                        <img id="avatar-img" src="" alt="preview" style="display:none" />
                        <span id="avatar-placeholder">?</span>
                    </div>
                </div>
                <div class="row-2m">
                    <div class="mfield">
                        <label class="mlabel">Họ <span class="req">*</span></label>
                        <input type="text" class="minp" id="m-last" placeholder="Nguyễn" />
                        <span class="merr" id="merr-last"></span>
                    </div>
                    <div class="mfield">
                        <label class="mlabel">Tên <span class="req">*</span></label>
                        <input type="text" class="minp" id="m-first" placeholder="Văn A" />
                        <span class="merr" id="merr-first"></span>
                    </div>
                </div>
                <div class="mfield">
                    <label class="mlabel">Email <span class="req">*</span></label>
                    <input type="email" class="minp" id="m-email" placeholder="example@email.com" />
                    <span class="merr" id="merr-email"></span>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="btn-cancel">Hủy</button>
                    <button type="submit" class="btn btn-primary" id="btn-save">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DELETE CONFIRM -->
    <div class="modal-overlay hidden" id="del-overlay">
        <div class="modal modal-sm" role="dialog">
            <div class="del-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#EE0033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
            </div>
            <h3 class="del-title">Xóa người dùng?</h3>
            <p class="del-sub">Hành động này không thể hoàn tác. Người dùng <strong id="del-name"></strong> sẽ bị xóa vĩnh viễn.</p>
            <div class="del-actions">
                <button class="btn btn-outline" id="del-cancel">Hủy</button>
                <button class="btn btn-danger" id="del-confirm">Xóa</button>
            </div>
        </div>
    </div>

    <script>
        // ─── Auth guard ──────────────────────────────────────────────────
        const storedUser = localStorage.getItem('vss_user');
        if (!storedUser) { window.location.href = 'login.html'; }
        else {
            const u = JSON.parse(storedUser);
            document.getElementById('user-greeting').textContent = `Xin chào, ${u.name || u.email}`;
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('vss_user');
            window.location.href = 'login.html';
        });

        // ─── Data (localStorage) ─────────────────────────────────────────
        const STORAGE_KEY = 'vss_users';
        let users = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (users.length === 0) {
            users = [
                { id: 1, first_name: 'George',  last_name: 'Bluth',   email: 'george.bluth@reqres.in',   avatar: 'https://reqres.in/img/faces/1-image.jpg' },
                { id: 2, first_name: 'Janet',   last_name: 'Weaver',  email: 'janet.weaver@reqres.in',   avatar: 'https://reqres.in/img/faces/2-image.jpg' },
                { id: 3, first_name: 'Emma',    last_name: 'Wong',    email: 'emma.wong@reqres.in',      avatar: 'https://reqres.in/img/faces/3-image.jpg' },
                { id: 4, first_name: 'Eve',     last_name: 'Holt',    email: 'eve.holt@reqres.in',       avatar: 'https://reqres.in/img/faces/4-image.jpg' },
                { id: 5, first_name: 'Charles', last_name: 'Morris',  email: 'charles.morris@reqres.in', avatar: 'https://reqres.in/img/faces/5-image.jpg' },
            ];
            save();
        }

        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(users)); }
        function nextId() { return users.length ? Math.max(...users.map(u => u.id)) + 1 : 1; }

        // ─── Render table ────────────────────────────────────────────────
        function render() {
            const tbody = document.getElementById('tbody');
            const empty = document.getElementById('empty-state');
            document.getElementById('user-count').textContent = users.length;

            if (users.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            tbody.innerHTML = users.map((u, i) => `
                <tr>
                    <td class="center">${i + 1}</td>
                    <td class="center">
                        <img class="avatar-cell" src="${u.avatar || ''}" alt="${u.first_name}"
                            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                            ${u.avatar ? '' : 'style="display:none"'} />
                        <div class="avatar-fallback" style="${u.avatar ? 'display:none' : ''}">
                            ${u.first_name ? u.first_name[0].toUpperCase() : '?'}
                        </div>
                    </td>
                    <td>${escHtml(u.last_name)}</td>
                    <td>${escHtml(u.first_name)}</td>
                    <td>${escHtml(u.email)}</td>
                    <td class="center action-td">
                        <button class="icon-btn edit-btn" title="Sửa" onclick="openEdit(${u.id})">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="icon-btn del-btn" title="Xóa" onclick="openDelete(${u.id})">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function escHtml(s) {
            return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        render();

        // ─── Modal helpers ───────────────────────────────────────────────
        let editId = null;

        function openModal(title) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('merr-last').textContent = '';
            document.getElementById('merr-first').textContent = '';
            document.getElementById('merr-email').textContent = '';
            document.getElementById('m-last').classList.remove('minp-error');
            document.getElementById('m-first').classList.remove('minp-error');
            document.getElementById('m-email').classList.remove('minp-error');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-form').reset();
            updateAvatarPreview('');
            editId = null;
        }

        function updateAvatarPreview(url) {
            const img = document.getElementById('avatar-img');
            const ph  = document.getElementById('avatar-placeholder');
            if (url) {
                img.src = url;
                img.style.display = '';
                ph.style.display = 'none';
            } else {
                img.style.display = 'none';
                ph.style.display = '';
            }
        }

        document.getElementById('m-avatar').addEventListener('input', e => updateAvatarPreview(e.target.value.trim()));
        document.getElementById('btn-add').addEventListener('click', () => { editId = null; openModal('Thêm người dùng'); });
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('btn-cancel').addEventListener('click', closeModal);
        document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) closeModal(); });

        window.openEdit = function(id) {
            const u = users.find(x => x.id === id);
            if (!u) return;
            editId = id;
            document.getElementById('m-last').value   = u.last_name  || '';
            document.getElementById('m-first').value  = u.first_name || '';
            document.getElementById('m-email').value  = u.email      || '';
            document.getElementById('m-avatar').value = u.avatar     || '';
            updateAvatarPreview(u.avatar || '');
            openModal('Sửa người dùng');
        };

        // ─── Modal form validate & submit ────────────────────────────────
        document.getElementById('modal-form').addEventListener('submit', e => {
            e.preventDefault();
            let ok = true;

            const last  = document.getElementById('m-last').value.trim();
            const first = document.getElementById('m-first').value.trim();
            const email = document.getElementById('m-email').value.trim();
            const avatar = document.getElementById('m-avatar').value.trim();

            function mErr(field, id, msg) {
                document.getElementById(id).textContent = msg;
                document.getElementById(field).classList.add('minp-error');
                ok = false;
            }
            function mOk(field, id) {
                document.getElementById(id).textContent = '';
                document.getElementById(field).classList.remove('minp-error');
            }

            if (!last)  mErr('m-last',  'merr-last',  'Vui lòng nhập họ');
            else        mOk('m-last',  'merr-last');

            if (!first) mErr('m-first', 'merr-first', 'Vui lòng nhập tên');
            else        mOk('m-first', 'merr-first');

            if (!email) {
                mErr('m-email', 'merr-email', 'Vui lòng nhập email');
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                mErr('m-email', 'merr-email', 'Email không đúng định dạng');
            } else {
                mOk('m-email', 'merr-email');
            }

            if (!ok) return;

            if (editId !== null) {
                const idx = users.findIndex(u => u.id === editId);
                if (idx > -1) { users[idx] = { ...users[idx], first_name: first, last_name: last, email, avatar }; }
            } else {
                users.push({ id: nextId(), first_name: first, last_name: last, email, avatar });
            }

            save();
            render();
            closeModal();
        });

        // ─── Delete ──────────────────────────────────────────────────────
        let deleteId = null;

        window.openDelete = function(id) {
            const u = users.find(x => x.id === id);
            if (!u) return;
            deleteId = id;
            document.getElementById('del-name').textContent = `${u.first_name} ${u.last_name}`;
            document.getElementById('del-overlay').classList.remove('hidden');
        };

        document.getElementById('del-cancel').addEventListener('click', () => {
            document.getElementById('del-overlay').classList.add('hidden');
            deleteId = null;
        });

        document.getElementById('del-confirm').addEventListener('click', () => {
            users = users.filter(u => u.id !== deleteId);
            save();
            render();
            document.getElementById('del-overlay').classList.add('hidden');
            deleteId = null;
        });

        document.getElementById('del-overlay').addEventListener('click', e => {
            if (e.target === document.getElementById('del-overlay')) {
                document.getElementById('del-overlay').classList.add('hidden');
                deleteId = null;
            }
        });
    </script>
</body>
</html>
